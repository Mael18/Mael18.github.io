<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHC-LordGrim // TempMail</title>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  :root {
    --bg: #050805; --border: #1a3a1a; --green: #00ff41;
    --green-dim: #00aa2a; --green-dark: #0a1a0a; --red: #ff3333;
    --text: #c8ffc8; --text-dim: #5a8a5a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    min-height: 100vh; overflow-x: hidden;
  }
  #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.15; pointer-events: none; }
  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }
  .header {
    border: 1px solid var(--border); background: rgba(5,8,5,0.9);
    padding: 16px 20px; margin-bottom: 20px; position: relative;
    box-shadow: 0 0 20px rgba(0,255,65,0.1), inset 0 0 20px rgba(0,255,65,0.03);
  }
  .header::before {
    content: "[ SECURE CHANNEL ]"; position: absolute; top: -10px; left: 20px;
    background: var(--bg); padding: 0 8px; color: var(--green-dim);
    font-size: 11px; letter-spacing: 2px;
  }
  .codename {
    color: var(--green); font-size: 22px; letter-spacing: 3px;
    text-shadow: 0 0 10px var(--green), 0 0 20px rgba(0,255,65,0.5);
    animation: flicker 3s infinite;
  }
  .codename::before { content: "> "; color: var(--green-dim); }
  .subtitle { color: var(--text-dim); font-size: 11px; letter-spacing: 2px; margin-top: 4px; }
  @keyframes flicker { 0%,100% { opacity: 1; } 92% { opacity: 1; } 93% { opacity: 0.6; } 94% { opacity: 1; } 96% { opacity: 0.8; } 97% { opacity: 1; } }
  .panel {
    background: rgba(10,18,10,0.9); border: 1px solid var(--border);
    padding: 16px; margin-bottom: 16px; position: relative;
    box-shadow: inset 0 0 30px rgba(0,255,65,0.03);
  }
  .panel::before {
    content: attr(data-label); position: absolute; top: -9px; left: 12px;
    background: var(--bg); padding: 0 8px; color: var(--green-dim);
    font-size: 10px; letter-spacing: 2px;
  }
  .email-display {
    font-size: 15px; color: var(--green); word-break: break-all;
    padding: 12px; background: var(--green-dark); border: 1px solid var(--border);
    margin-bottom: 12px; min-height: 44px; display: flex; align-items: center;
    text-shadow: 0 0 5px rgba(0,255,65,0.5);
  }
  .email-display::before { content: "$"; color: var(--green-dim); margin-right: 10px; }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--green); animation: blink 1s infinite; margin-left: 2px; vertical-align: middle; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    background: transparent; color: var(--green); border: 1px solid var(--green-dim);
    padding: 8px 16px; font-family: 'Share Tech Mono', monospace;
    font-size: 12px; letter-spacing: 2px; cursor: pointer; transition: all 0.15s; text-transform: uppercase;
  }
  button:hover { background: var(--green); color: var(--bg); box-shadow: 0 0 15px var(--green); }
  button:active { transform: translateY(1px); }
  button::before { content: "[ "; opacity: 0.6; }
  button::after { content: " ]"; opacity: 0.6; }
  button.primary { border-color: var(--green); box-shadow: 0 0 10px rgba(0,255,65,0.3); }
  .status {
    color: var(--text-dim); font-size: 11px; margin-top: 10px;
    padding-top: 10px; border-top: 1px dashed var(--border); letter-spacing: 1px;
  }
  .status::before { content: ">>> "; color: var(--green-dim); }
  .status.error { color: var(--red); }
  .status.ok { color: var(--green); }
  .msg {
    background: rgba(10,18,10,0.7); border-left: 3px solid var(--green-dim);
    padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
    transition: all 0.15s; position: relative;
  }
  .msg:hover { background: rgba(0,255,65,0.08); border-left-color: var(--green); transform: translateX(4px); }
  .msg-from { color: var(--green); font-size: 11px; letter-spacing: 1px; }
  .msg-from::before { content: "FROM: "; color: var(--text-dim); }
  .msg-subject { color: var(--text); font-size: 13px; margin: 4px 0; font-weight: bold; }
  .msg-date { color: var(--text-dim); font-size: 10px; letter-spacing: 1px; }
  .empty { color: var(--text-dim); text-align: center; padding: 40px 20px; font-size: 12px; letter-spacing: 2px; border: 1px dashed var(--border); }
  .empty::before { content: "> "; }
  .empty::after { content: "_"; animation: blink 1s infinite; }
  .email-view { background: rgba(10,18,10,0.9); border: 1px solid var(--border); margin-top: 16px; overflow: hidden; }
  .email-header { padding: 16px; border-bottom: 1px solid var(--border); font-size: 12px; line-height: 1.7; background: var(--green-dark); }
  .email-header .field { display: flex; gap: 8px; }
  .email-header .key { color: var(--green-dim); min-width: 80px; letter-spacing: 1px; }
  .email-header .val { color: var(--text); word-break: break-all; }
  .toggle-bar { padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--border); font-size: 11px; display: flex; gap: 8px; align-items: center; letter-spacing: 1px; }
  .toggle-bar span { color: var(--text-dim); }
  .toggle-bar button { padding: 4px 10px; font-size: 10px; margin: 0; }
  .toggle-bar button.active { background: var(--green); color: var(--bg); box-shadow: 0 0 10px var(--green); }
  .email-body-frame { width: 100%; min-height: 400px; border: none; background: #fff; display: block; }
  .email-body-text { padding: 16px; white-space: pre-wrap; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--text); max-height: 500px; overflow-y: auto; }
  .attachments { padding: 12px 16px; background: var(--green-dark); border-top: 1px solid var(--border); }
  .attachments-title { color: var(--green-dim); font-size: 11px; letter-spacing: 2px; margin-bottom: 8px; }
  .attachment { display: inline-block; padding: 6px 12px; background: var(--bg); border: 1px solid var(--green-dim); color: var(--green); font-size: 11px; margin-right: 8px; margin-top: 4px; text-decoration: none; letter-spacing: 1px; transition: all 0.15s; }
  .attachment:hover { background: var(--green); color: var(--bg); box-shadow: 0 0 10px var(--green); }
  .attachment::before { content: ">> "; }
  .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px); opacity: 0.4; }
  .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9998; pointer-events: none; background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.6) 100%); }
  @media (max-width: 600px) {
    .container { padding: 12px; }
    .codename { font-size: 16px; letter-spacing: 2px; }
    .email-display { font-size: 12px; }
    button { padding: 6px 12px; font-size: 11px; }
  }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="container">
  <div class="header">
    <div class="codename">PHC-LordGrim</div>
    <div class="subtitle">TEMPMAIL TERMINAL v5.0 // 1SECMAIL DIRECT</div>
  </div>
  <div class="panel" data-label="INBOX">
    <div class="email-display" id="addr">initializing<span class="cursor"></span></div>
    <div class="btn-row">
      <button class="primary" onclick="newInbox()">New Inbox</button>
      <button onclick="copyAddr()">Copy</button>
      <button onclick="refresh()">Refresh</button>
    </div>
    <div class="status" id="status">booting system...</div>
  </div>
  <div id="list"></div>
  <div id="view"></div>
</div>

<script>
(function matrixRain() {
  var canvas = document.getElementById('matrix');
  var ctx = canvas.getContext('2d');
  var w, h, cols, drops;
  var chars = 'PHC-LordGrim01\u30a2\u30a4\u30a6\u30a8\u30aa\u30ab\u30ad\u30af\u30b1\u30b3\u30b5\u30b7\u30b9\u30bb\u30bd\u30bf\u30c1\u30c4\u30c6\u30c8\u30ca\u30cb\u30cc\u30cd\u30ce\u30cf\u30d2\u30d5\u30d8\u30db';
  var fontSize = 14;
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w / fontSize);
    drops = new Array(cols).fill(1);
  }
  function draw() {
    ctx.fillStyle = 'rgba(5, 8, 5, 0.06)';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#00ff41';
    ctx.font = fontSize + 'px Share Tech Mono, monospace';
    for (var i = 0; i < drops.length; i++) {
      var text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  resize();
  window.addEventListener('resize', resize);
  setInterval(draw, 66);
})();

// ─── 1secmail direct API — GET only, CORS-enabled, no auth, no backend ───
// Docs: https://www.1secmail.com/api/
var API = "https://www.1secmail.com/api/v1/";

var address = null;
var login = null;
var domain = null;
var pollTimer = null;
var currentEmail = null;
var renderMode = "html";
var currentOpenId = null;
var isRefreshing = false;

function setStatus(msg, type) {
  var el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status" + (type ? " " + type : "");
}
function setAddr(a) {
  document.getElementById("addr").innerHTML = esc(a) + '<span class="cursor"></span>';
}
function esc(t) {
  var d = document.createElement("div");
  d.textContent = t || "";
  return d.innerHTML;
}
function escapeAttr(s) {
  return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function formatBytes(b) {
  if (b < 1024) return b + " B";
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
  return (b / 1024 / 1024).toFixed(1) + " MB";
}

async function gfetch(url) {
  var res = await fetch(url, { mode: "cors" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  var text = await res.text();
  try { return JSON.parse(text); }
  catch (e) { throw new Error("Bad JSON: " + text.substring(0, 100)); }
}

async function newInbox() {
  setStatus("creating new identity...", "ok");
  try {
    var domains = await gfetch(API + "?action=getDomainList");
    if (!Array.isArray(domains) || domains.length === 0) {
      throw new Error("no domains available");
    }
    domain = domains[Math.floor(Math.random() * domains.length)];
    login = Math.random().toString(36).substring(2, 12);
    address = login + "@" + domain;

    localStorage.setItem("tm_addr", address);
    localStorage.setItem("tm_login", login);
    localStorage.setItem("tm_domain", domain);

    setAddr(address);
    setStatus("online // polling every 5s", "ok");
    document.getElementById("view").innerHTML = "";
    currentOpenId = null;

    if (pollTimer) clearInterval(pollTimer);
    refresh();
    pollTimer = setInterval(refresh, 5000);
  } catch (e) {
    setStatus("error: " + e.message, "error");
  }
}

async function refresh() {
  if (!login || !domain || isRefreshing) return;
  isRefreshing = true;
  try {
    var url = API + "?action=getMessages&login=" + encodeURIComponent(login) + "&domain=" + encodeURIComponent(domain);
    var data = await gfetch(url);
    updateList(Array.isArray(data) ? data : []);
  } catch (e) {
    setStatus("refresh error: " + e.message, "error");
  } finally {
    isRefreshing = false;
  }
}

function updateList(msgs) {
  var list = document.getElementById("list");
  if (!msgs || msgs.length === 0) {
    if (list.dataset.empty !== "true") {
      list.innerHTML = '<div class="empty">no messages // awaiting transmission</div>';
      list.dataset.empty = "true";
    }
    return;
  }
  list.dataset.empty = "false";
  var existingNodes = new Map();
  list.querySelectorAll(".msg").forEach(function(node) { existingNodes.set(node.dataset.id, node); });
  existingNodes.forEach(function(node, id) {
    var stillExists = msgs.some(function(m) { return String(m.id) === String(id); });
    if (!stillExists) { if (node.parentNode === list) list.removeChild(node); }
  });
  msgs.forEach(function(m, index) {
    var mid = String(m.id);
    var node = existingNodes.get(mid);
    if (!node) {
      node = document.createElement("div");
      node.className = "msg";
      node.dataset.id = mid;
      node.onclick = (function(id) { return function() { openMsg(id); }; })(mid);
      node.innerHTML =
        '<div class="msg-from">' + esc(m.from || "(unknown)") + '</div>' +
        '<div class="msg-subject">' + esc(m.subject || "(no subject)") + '</div>' +
        '<div class="msg-date">' + esc(m.date || "") + '</div>';
      if (list.children[index]) list.insertBefore(node, list.children[index]);
      else list.appendChild(node);
    } else {
      var from = node.querySelector(".msg-from");
      var subj = node.querySelector(".msg-subject");
      var date = node.querySelector(".msg-date");
      if (from) from.textContent = m.from || "(unknown)";
      if (subj) subj.textContent = m.subject || "(no subject)";
      if (date) date.textContent = m.date || "";
    }
  });
}

async function openMsg(id) {
  if (currentOpenId === id) return;
  currentOpenId = id;
  try {
    var url = API + "?action=readMessage&login=" + encodeURIComponent(login) + "&domain=" + encodeURIComponent(domain) + "&id=" + encodeURIComponent(id);
    var m = await gfetch(url);
    currentEmail = m;
    renderMode = "html";
    renderEmail();
  } catch (e) {
    setStatus("open error: " + e.message, "error");
  }
}

function renderEmail() {
  var m = currentEmail;
  if (!m) return;
  var view = document.getElementById("view");
  var hasHtml = m.htmlBody && m.htmlBody.length > 0;
  var textBody = m.textBody || (m.htmlBody ? m.htmlBody.replace(/<[^>]+>/g, "") : "(no body)");

  var attachHtml = "";
  if (m.attachments && m.attachments.length > 0) {
    var items = m.attachments.map(function(a) {
      var dl = API + "?action=download&login=" + encodeURIComponent(login) + "&domain=" + encodeURIComponent(domain) + "&id=" + encodeURIComponent(m.id) + "&file=" + encodeURIComponent(a.filename);
      return '<a class="attachment" href="' + dl + '" target="_blank" rel="noopener noreferrer">' +
        esc(a.filename) + ' (' + formatBytes(a.size) + ')</a>';
    }).join("");
    attachHtml = '<div class="attachments"><div class="attachments-title">// ATTACHMENTS</div>' + items + '</div>';
  }

  var toggleBar = "";
  if (hasHtml) {
    toggleBar = '<div class="toggle-bar"><span>VIEW:</span>' +
      '<button class="' + (renderMode === 'html' ? 'active' : '') + '" onclick="setRenderMode(\'html\')">HTML</button>' +
      '<button class="' + (renderMode === 'text' ? 'active' : '') + '" onclick="setRenderMode(\'text\')">TEXT</button>' +
      '<span style="margin-left:auto;">' + (renderMode === 'html' ? '[SANDBOXED]' : '[RAW]') + '</span></div>';
  }

  var bodyHtml;
  if (renderMode === "html" && hasHtml) {
    var sanitized = sanitizeHtml(m.htmlBody);
    var proxiedImgs = proxyImages(sanitized);
    var doc = buildIframeDoc(proxiedImgs);
    bodyHtml = '<iframe class="email-body-frame" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" srcdoc="' + escapeAttr(doc) + '"></iframe>';
  } else {
    bodyHtml = '<div class="email-body-text">' + esc(textBody) + '</div>';
  }

  view.innerHTML = '<div class="email-view">' +
    '<div class="email-header">' +
    '<div class="field"><span class="key">FROM:</span><span class="val">' + esc(m.from || "(unknown)") + '</span></div>' +
    '<div class="field"><span class="key">SUBJECT:</span><span class="val">' + esc(m.subject || "(no subject)") + '</span></div>' +
    '<div class="field"><span class="key">DATE:</span><span class="val">' + esc(m.date || "") + '</span></div>' +
    '</div>' + toggleBar + bodyHtml + attachHtml + '</div>';
}

function sanitizeHtml(dirty) {
  return DOMPurify.sanitize(dirty, {
    ALLOWED_TAGS: ["p","br","hr","span","div","wbr","h1","h2","h3","h4","h5","h6","b","i","u","s","strong","em","small","sub","sup","mark","blockquote","pre","code","ul","ol","li","dl","dt","dd","table","thead","tbody","tfoot","tr","td","th","caption","a","img","center","font"],
    ALLOWED_ATTR: ["href","title","alt","src","width","height","align","valign","border","cellpadding","cellspacing","colspan","rowspan","bgcolor","color","face","size","style","class","id","dir","lang"],
    ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto|tel):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i,
    FORBID_TAGS: ["script","style","iframe","form","input","button","select","textarea","meta","link","base","object","embed","applet","frame","frameset","noscript"],
    FORBID_ATTR: ["onerror","onload","onclick","onmouseover","onfocus","onblur","onchange","onsubmit","formaction","action","ping","srcdoc","sandbox","target","contenteditable","autofocus"],
    KEEP_CONTENT: true, SANITIZE_DOM: true, SAFE_FOR_TEMPLATES: true
  });
}

function proxyImages(html) {
  var P = "https://wsrv.nl/?url=";
  return html.replace(/<img\b([^>]*)>/gi, function(match, attrs) {
    var sm = attrs.match(/src\s*=\s*["']([^"']+)["']/i);
    if (!sm) return match;
    var src = sm[1];
    if (/^data:/i.test(src)) return match.replace(/src\s*=\s*["'][^"']+["']/i, 'src="" alt="[blocked]"');
    if (src.indexOf(P) === 0) return match;
    if (src.indexOf("//") === 0) src = "https:" + src;
    if (src.indexOf("/") === 0) return match;
    return match.replace(/src\s*=\s*["'][^"']+["']/i, 'src="' + P + encodeURIComponent(src) + '"');
  });
}

function buildIframeDoc(bodyHtml) {
  var doc = document.implementation.createHTMLDocument("email");
  var meta = doc.createElement("meta");
  meta.setAttribute("charset", "UTF-8");
  doc.head.appendChild(meta);
  var viewport = doc.createElement("meta");
  viewport.setAttribute("name", "viewport");
  viewport.setAttribute("content", "width=device-width, initial-scale=1.0");
  doc.head.appendChild(viewport);
  var base = doc.createElement("base");
  base.setAttribute("target", "_blank");
  doc.head.appendChild(base);
  var style = doc.createElement("style");
  style.textContent = "html,body{margin:0;padding:16px;font-family:Arial,sans-serif;font-size:14px;line-height:1.5;color:#222;background:#fff;word-wrap:break-word;}img{max-width:100%;height:auto;}table{max-width:100%;}a{color:#0066cc;}pre{white-space:pre-wrap;word-wrap:break-word;}blockquote{border-left:3px solid #ccc;margin-left:0;padding-left:12px;color:#555;}";
  doc.head.appendChild(style);
  doc.body.innerHTML = bodyHtml;
  doc.body.addEventListener("click", function(e) {
    var t = e.target;
    while (t && t.tagName !== "A") t = t.parentNode;
    if (t && t.href) {
      e.preventDefault();
      if (confirm("Open link?\n\n" + t.href)) window.open(t.href, "_blank", "noopener,noreferrer");
    }
  }, true);
  doc.body.addEventListener("submit", function(e) { e.preventDefault(); alert("Form blocked."); }, true);
  return "<!DOCTYPE html>" + doc.documentElement.outerHTML;
}

function setRenderMode(mode) { renderMode = mode; renderEmail(); }
function copyAddr() {
  if (address) {
    navigator.clipboard.writeText(address);
    setStatus("address copied to clipboard", "ok");
    setTimeout(function() { setStatus("online // polling every 5s", "ok"); }, 1500);
  }
}

(function init() {
  var sa = localStorage.getItem("tm_addr");
  var sl = localStorage.getItem("tm_login");
  var sd = localStorage.getItem("tm_domain");
  if (sa && sl && sd) {
    address = sa; login = sl; domain = sd;
    setAddr(address);
    setStatus("restored session // polling", "ok");
    refresh();
    pollTimer = setInterval(refresh, 5000);
  } else {
    newInbox();
  }
})();
</script>
</body>
</html>
